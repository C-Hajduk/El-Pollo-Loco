<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="img/Favicon/kaktus.png" />
    <title>El Pollo Loco</title>
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/smallChicken.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/coins.class.js"></script>
    <script src="./models/bottles.class.js"></script>
    <script src="./models/statusbar.class.js"></script>
    <script src="./models/endbossBar.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/soundHub.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./levels/level1.js"></script>
  </head>

  <body onload="init()">
    <h1>El pollo loco</h1>

    <div class="game-screen">
      <div id="startScreen" class="start-screen">
        <div class="start-button-container">
          <button class="start-btn" onclick="startGame()">Start</button>
          <div class="fullscreen-volume-container">
            <button onclick="showImpressum()">Impressum</button>
            <button class="fullScreen-icon" onclick="fullScreen()">
              <img
                src="./img/9_intro_outro_screens/start/fullscreen.png"
                alt="fullScreen"
              />
            </button>
            <button id="audio_button" class="audio-btn" onclick="toggleAudio()">
              🔊
            </button>
          </div>
        </div>
        <div class="controls" id="controls">
          <p>Move Left and Right</p>
          <img class="arrow-img" src="img/controls/left-arrow.png" />
          <img class="arrow-img" src="img/controls/right-arrow.png" />
          <p>Jump</p>
          <img class="space-img" src="img/controls/space.png" />
          <p>Throw Bottle</p>
          <p>D</p>
        </div>
      </div>

      <div id="gameoverScreen" class="gameover-screen">
        <div class="gameover-button-container">
          <button class="restart-btn" onclick="restartGame()">Play again</button>
          <button class="back-btn" onclick="backToStartScreen()">Leave Game</button>
        </div>
      </div>

      <div id="winScreen" class="win-screen">
        <div class="gameover-button-container">
          <button class="restart-btn" onclick="restartGame()">Play again</button>
          <button class="back-btn" onclick="backToStartScreen()">Leave Game</button>
        </div>
      </div>

      <canvas id="canvas" width="720" height="480"></canvas>

      <dialog id="impressum" class="impressum">
        <h1>Impressum</h1>
        <button onclick="closeImpressum()" class="arrow-back">↩</button>
        <section class="impressum-details">
          <div>
            <p>Christian Hajduk</p>
            <p>Egypten 32</p>
            <p>28876 Oyten</p>
            <p>E-Mail: 0152 5 4048427</p>
            <p>Telefon: christian.hajduk@outlook.de</p>
          </div>
        </section>
      </dialog>
    </div>
  </body>
  <script src="./scripts/game.js"></script>
</html>
